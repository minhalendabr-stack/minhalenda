name: Entregas

# Produz os livros dos pedidos pagos: o site dispara este workflow quando o pagamento é confirmado
# (repository_dispatch) e um agendamento confere a fila a cada 20 min como reserva.
# O repositório é público: o log NUNCA mostra nome de criança, título ou link de entrega (ver entrega.py).
on:
  repository_dispatch:
    types: [pedido_pago]
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      pedido:
        description: "ID do pedido (opcional, ex.: ML-ABC123)"
        required: false

concurrency:
  group: entregas
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # token OIDC: o site confere que a chamada vem deste workflow (sem segredos no GitHub)

jobs:
  produzir:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ML_CACHE: /tmp/ml-cache
      ML_OUT: /tmp/ml-out
      ML_FONTS: ${{ github.workspace }}/entrega/fonts
    steps:
      - uses: actions/checkout@v4

      - name: Fila de pedidos
        id: fila
        env:
          PEDIDO: ${{ github.event.inputs.pedido || github.event.client_payload.pedido }}
        run: |
          tok=$(curl -sf -H "authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=minhalenda" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          echo "::add-mask::$tok"
          n=$(curl -sf -A 'MinhaLenda-Executor/1.0' -H "authorization: Bearer $tok" "https://minhalenda.com.br/admin/api/pedidos?status=fila" | python3 -c "import sys,json;print(len(json.load(sys.stdin)['pedidos']))" || echo 0)
          if [ -n "$PEDIDO" ]; then n=1; fi
          echo "pedidos na fila: $n"
          echo "n=$n" >> "$GITHUB_OUTPUT"

      - name: Preparar ambiente
        if: steps.fila.outputs.n != '0'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -hide_banner -filters | grep -q rubberband || (echo "ffmpeg sem rubberband" && exit 1)
          python3 -m pip install -q -r entrega/requirements.txt
          python3 -m playwright install --with-deps chromium > /dev/null

      - name: Produzir e entregar
        if: steps.fila.outputs.n != '0'
        env:
          PEDIDO: ${{ github.event.inputs.pedido || github.event.client_payload.pedido }}
        run: python3 entrega/entrega.py $PEDIDO
